          def shape_text(text: str, lang: str = "ar") -> str:
              if not text:
                  return ""
              if lang == "ar" and HAS_ARABIC_SHAPER:
                  try:
                      return get_display(arabic_reshaper.reshape(text))
                  except Exception:
                      return text
              return text

          def get_font(size: int, bold: bool = True):
              for path in [
                  "/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf",
                  "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
              ]:
                  if os.path.exists(path):
                      try:
                          return ImageFont.truetype(path, size=size)
                      except Exception:
                          continue
              return ImageFont.load_default()

          def get_episode_index(channel_key: str) -> int:
              run_num_str = os.environ.get("GITHUB_RUN_NUMBER", "").strip()
              attempt_str = os.environ.get("GITHUB_RUN_ATTEMPT", "1").strip()
              if run_num_str.isdigit():
                  return int(run_num_str) + int(attempt_str if attempt_str.isdigit() else 1) - 1
              return int(time.time() // 3600)

          def generate_dynamic_script(channel_key: str, cfg: dict) -> dict:
              lang = cfg["lang"]
              ep_idx = get_episode_index(channel_key)
              bank = EPISODE_BANK_AR if lang == "ar" else EPISODE_BANK_EN
              template_ep = bank[ep_idx % len(bank)]
              part_num = (ep_idx % 12) + 1
              part_label = f"الجزء {part_num}" if lang == "ar" else f"Part {part_num}"
              gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
              if gemini_key:
                  prompt = (
                      f"Create Episode '{part_label}' of an investigative YouTube Shorts series for '{cfg['name']}'. "
                      f"Topic inspiration (make a FRESH angle for {part_label}): {template_ep['title']}. "
                      f"Return STRICT JSON ONLY with keys: 'title' (start with '{part_label} | ' and end with '#Shorts'), "
                      f"'part' ('{part_label}'), 'series_title' ('{template_ep['series_title']}'), "
                      f"'segments' (list of 4 segments with keys: 'layout' ['presenter_full','split_screen','pip_broll','presenter_full'], "
                      f"'narration' [22-30 words in {'Arabic' if lang == 'ar' else 'English'}], "
                      f"'caption' [max 8 words in {'Arabic' if lang == 'ar' else 'English'}], "
                      f"'broll_query' [3-4 English keywords for documentary footage search], "
                      f"'broll_prompt' [English FLUX prompt], 'stat_badge' [short upper-case badge])."
                  )
                  for model_name in ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"]:
                      try:
                          url = f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={gemini_key}"
                          payload = json.dumps({
                              "contents": [{"parts": [{"text": prompt}]}],
                              "generationConfig": {"temperature": 0.85, "responseMimeType": "application/json"}
                          }).encode("utf-8")
                          req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
                          with urllib.request.urlopen(req, timeout=25) as resp:
                              data = json.loads(resp.read().decode("utf-8"))
                          raw_text = data["candidates"][0]["content"]["parts"][0]["text"].strip()
                          if raw_text.startswith("```"):
                              raw_text = raw_text.split("```")[1]
                              if raw_text.startswith("json"):
                                  raw_text = raw_text[4:]
                          parsed = json.loads(raw_text.strip())
                          if isinstance(parsed.get("segments"), list) and len(parsed["segments"]) >= 3:
                              return parsed
                      except Exception as e:
                          print(f"Gemini notice ({model_name}): {e}")
              return json.loads(json.dumps(template_ep))

          def _create_gradio_client(space_id: str):
              from gradio_client import Client
              hf_token = os.environ.get("HF_TOKEN", "").strip()
              if hf_token:
                  os.environ["HF_TOKEN"] = hf_token
              return Client(space_id)

          def _extract_file_from_gradio_result(res):
              if isinstance(res, str) and os.path.exists(res):
                  return res
              if isinstance(res, dict):
                  for k in ("video", "path", "url", "image", "value"):
                      v = res.get(k)
                      if isinstance(v, str) and os.path.exists(v):
                          return v
                      if isinstance(v, dict) and isinstance(v.get("path"), str) and os.path.exists(v["path"]):
                          return v["path"]
              if isinstance(res, (list, tuple)):
                  for item in res:
                      found = _extract_file_from_gradio_result(item)
                      if found:
                          return found
              return None

          def generate_flux_image_zerogpu(prompt: str, out_path: Path, width: int = 768, height: int = 1024) -> bool:
              for space_id, api_name in [("black-forest-labs/FLUX.1-schnell", "/infer"), ("multimodalart/FLUX.1-merged", "/infer")]:
                  try:
                      client = _create_gradio_client(space_id)
                      res = client.predict(prompt, random.randint(1, 999999), True, width, height, 4, api_name=api_name)
                      fpath = _extract_file_from_gradio_result(res)
                      if fpath and os.path.exists(fpath):
                          Image.open(fpath).convert("RGB").save(out_path, quality=95)
                          return True
                  except Exception as e:
                      print(f"FLUX notice ({space_id}): {e}")
              return False

          def fetch_wikimedia_visual(query: str, out_path: Path, prefer_video: bool = False):
              headers = {"User-Agent": "EmpireMediaBot/10.0 (https://github.com/yoyomado2312-byte/empire-cloud)"}
              try:
                  ft = "video" if prefer_video else "bitmap"
                  q_enc = urllib.parse.quote(f"{query} filetype:{ft}")
                  api_url = f"https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch={q_enc}&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|size|mime&format=json"
                  req = urllib.request.Request(api_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                  pages = data.get("query", {}).get("pages", {})
                  candidates = []
                  for _, p in pages.items():
                      ii = (p.get("imageinfo") or [{}])[0]
                      url, mime, w, h = ii.get("url", ""), ii.get("mime", ""), ii.get("width", 0), ii.get("height", 0)
                      if prefer_video and ("video/" in mime or url.endswith((".webm", ".mp4"))):
                          candidates.append(url)
                      elif not prefer_video and ("image/jpeg" in mime or "image/png" in mime) and w >= 500 and h >= 400:
                          candidates.append(url)
                  if candidates:
                      chosen = random.choice(candidates[:4])
                      with urllib.request.urlopen(urllib.request.Request(chosen, headers=headers), timeout=15) as r2:
                          raw = r2.read()
                      if len(raw) > 8000:
                          out_path.write_bytes(raw)
                          return str(out_path)
              except Exception as e:
                  print(f"Wikimedia notice ({query}): {e}")
              return None

          def build_procedural_infographic_card(out_path: Path, title_text: str, badge_text: str, lang: str, seg_idx: int) -> Path:
              W, H = 1080, 1080
              y_grid, x_grid = np.mgrid[0:H, 0:W].astype(np.float32)
              palettes = [
                  ((12, 28, 58), (0, 190, 215), (255, 185, 40)),
                  ((24, 16, 52), (165, 75, 255), (0, 230, 175)),
                  ((14, 38, 34), (16, 215, 135), (255, 200, 50)),
                  ((42, 18, 28), (245, 75, 115), (255, 195, 55)),
              ]
              c_bg, c_pri, c_sec = palettes[seg_idx % len(palettes)]
              dist = np.sqrt((x_grid - W * 0.5) ** 2 + (y_grid - H * 0.45) ** 2) / (W * 0.75)
              glow = np.clip(1.0 - dist, 0.0, 1.0) ** 1.6
              arr = np.zeros((H, W, 3), dtype=np.float32)
              for ch in range(3):
                  arr[:, :, ch] = c_bg[ch] * (1.0 - 0.55 * glow) + c_pri[ch] * (0.55 * glow)
              grid_mask = ((np.mod(x_grid, 72) < 1.5) | (np.mod(y_grid, 72) < 1.5)).astype(np.float32) * 0.14
              for ch in range(3):
                  arr[:, :, ch] = np.clip(arr[:, :, ch] + grid_mask * c_sec[ch], 0, 255)
              im = Image.fromarray(arr.astype(np.uint8), "RGB")
              draw = ImageDraw.Draw(im, "RGBA")
              chart_left, chart_bottom, chart_w, chart_h = 130, 820, 820, 460
              draw.rounded_rectangle([chart_left - 35, chart_bottom - chart_h - 50, chart_left + chart_w + 35, chart_bottom + 45], radius=28, fill=(10, 16, 30, 195), outline=(*c_pri, 210), width=3)
              bar_heights = [0.28, 0.42, 0.38, 0.61, 0.78, 0.94]
              bw, gap = 82, (chart_w - 6 * 82) // 7
              pts = []
              for i, bh in enumerate(bar_heights):
                  bx = chart_left + gap + i * (bw + gap)
                  by = int(chart_bottom - bh * chart_h)
                  bar_col = c_sec if i == 5 else c_pri
                  draw.rounded_rectangle([bx, by, bx + bw, chart_bottom], radius=14, fill=(*bar_col, 225))
                  pts.append((bx + bw // 2, by - 18))
              draw.line(pts, fill=(255, 255, 255, 240), width=6)
              for px, py in pts:
                  draw.ellipse([px - 11, py - 11, px + 11, py + 11], fill=(*c_sec, 255), outline=(255, 255, 255, 255), width=3)
              draw.rounded_rectangle([95, 75, 985, 155], radius=20, fill=(*c_sec, 235))
              draw.text((540, 115), badge_text, font=get_font(36), fill=(12, 16, 28, 255), anchor="mm")
              draw.text((540, 235), shape_text(title_text, lang), font=get_font(44), fill=(255, 255, 255, 255), anchor="mm")
              im.save(out_path, quality=95)
              return out_path

          def build_realistic_studio_presenter_portrait(out_path: Path, cfg: dict, work_dir: Path) -> Path:
              if out_path.exists() and out_path.stat().st_size > 15000:
                  return out_path
              if generate_flux_image_zerogpu(cfg["presenter_prompt"], out_path, width=768, height=1024):
                  return out_path
              urls = cfg.get("presenter_fallback_urls", [])
              ep_idx = get_episode_index("presenter")
              for i in range(len(urls)):
                  u = urls[(ep_idx + i) % len(urls)]
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=12) as resp:
                          raw = resp.read()
                      if len(raw) > 15000:
                          out_path.write_bytes(raw)
                          Image.open(out_path).convert("RGB").save(out_path, quality=95)
                          return out_path
                  except Exception:
                      pass
              if fetch_wikimedia_visual("television news presenter studio portrait", out_path, prefer_video=False) and out_path.exists():
                  return out_path
              W, H = 900, 1100
              im = Image.new("RGB", (W, H), (22, 28, 45))
              draw = ImageDraw.Draw(im, "RGBA")
              draw.ellipse([60, 80, 340, 360], fill=(0, 180, 220, 70))
              draw.ellipse([580, 120, 860, 400], fill=(255, 160, 50, 70))
              draw.polygon([(140, 1100), (260, 720), (640, 720), (760, 1100)], fill=(32, 38, 52, 255))
              draw.rectangle([400, 590, 500, 745], fill=(210, 162, 130, 255))
              draw.ellipse([295, 230, 605, 650], fill=(224, 176, 142, 255))
              draw.pieslice([290, 210, 610, 480], start=180, end=360, fill=(28, 24, 22, 255))
              for ex in (385, 515):
                  draw.ellipse([ex - 28, 410, ex + 28, 438], fill=(250, 250, 252, 255))
                  draw.ellipse([ex - 12, 412, ex + 12, 436], fill=(42, 28, 18, 255))
              draw.rounded_rectangle([405, 548, 495, 568], radius=9, fill=(175, 95, 92, 255))
              im.save(out_path, quality=95)
              return out_path

          def detect_face_and_mouth_anchor(portrait_rgb: np.ndarray):
              H, W, _ = portrait_rgb.shape
              r, g, b = portrait_rgb[:, :, 0].astype(np.float32), portrait_rgb[:, :, 1].astype(np.float32), portrait_rgb[:, :, 2].astype(np.float32)
              cr = 128.0 + 0.5 * r - 0.418688 * g - 0.081312 * b
              cb = 128.0 - 0.168736 * r - 0.331264 * g + 0.5 * b
              skin = (cr > 135) & (cr < 178) & (cb > 80) & (cb < 132)
              skin[: int(H * 0.12), :] = False
              skin[int(H * 0.78) :, :] = False
              skin[:, : int(W * 0.18)] = False
              skin[:, int(W * 0.82) :] = False
              ys, xs = np.where(skin)
              if len(xs) > 1500:
                  x_min, x_max = int(np.percentile(xs, 8)), int(np.percentile(xs, 92))
                  y_min, y_max = int(np.percentile(ys, 6)), int(np.percentile(ys, 92))
                  face_w, face_h = max(180, x_max - x_min), max(220, y_max - y_min)
                  return int((x_min + x_max) * 0.5), int(y_min + face_h * 0.73), int(face_w * 0.34), int(face_h * 0.24)
              return W // 2, int(H * 0.51), int(W * 0.15), int(H * 0.11)

          def animate_human_presenter_frame(base_portrait: np.ndarray, mx: int, my: int, mouth_w: int, jaw_h: int, amp: float, t_sec: float) -> np.ndarray:
              H, W, _ = base_portrait.shape
              frame = base_portrait.copy()
              open_amount = float(np.clip(amp * (0.65 + 0.35 * math.sin(t_sec * 24.0)), 0.0, 1.0))
              jaw_shift = int(round(open_amount * max(10, int(jaw_h * 0.18))))
              if jaw_shift > 1:
                  x0, x1 = max(0, mx - int(mouth_w * 0.85)), min(W, mx + int(mouth_w * 0.85))
                  y0, y1 = max(0, my), min(H - jaw_shift - 1, my + jaw_h)
                  if y1 > y0 and x1 > x0:
                      sub = base_portrait[y0:y1, x0:x1].astype(np.float32)
                      shifted = base_portrait[y0 - jaw_shift : y1 - jaw_shift, x0:x1].astype(np.float32)
                      sh, sw, _ = sub.shape
                      yy, xx = np.mgrid[0:sh, 0:sw].astype(np.float32)
                      mask = (np.clip(1.0 - (((xx - sw * 0.5) / (sw * 0.5 + 1e-5)) ** 2 + ((yy - sh * 0.35) / (sh * 0.65 + 1e-5)) ** 2), 0.0, 1.0) ** 1.4)[:, :, None]
                      frame[y0:y1, x0:x1] = (sub * (1.0 - mask) + shifted * mask).astype(np.uint8)
                      lip_rx, lip_ry = max(12, int(mouth_w * (0.36 + 0.10 * open_amount))), max(2, int(jaw_shift * 0.72))
                      ly0, ly1, lx0, lx1 = max(0, my - lip_ry // 2), min(H, my + lip_ry + 2), max(0, mx - lip_rx), min(W, mx + lip_rx)
                      if ly1 > ly0 and lx1 > lx0:
                          oy, ox = np.mgrid[ly0:ly1, lx0:lx1].astype(np.float32)
                          elli = ((ox - mx) / (lip_rx + 1e-5)) ** 2 + ((oy - (my + lip_ry * 0.3)) / (lip_ry + 1e-5)) ** 2
                          mouth_inside = elli <= 1.0
                          cavity = frame[ly0:ly1, lx0:lx1].astype(np.float32)
                          teeth_band = (oy < (my - lip_ry * 0.05)) & (elli <= 0.78)
                          cavity[mouth_inside] = cavity[mouth_inside] * 0.22 + np.array([38.0, 18.0, 20.0]) * 0.78
                          cavity[teeth_band] = cavity[teeth_band] * 0.35 + np.array([230.0, 226.0, 220.0]) * 0.65
                          frame[ly0:ly1, lx0:lx1] = cavity.astype(np.uint8)
              return frame

          def compute_audio_envelope(wav_path: Path, fps: int = 30):
              with wave.open(str(wav_path), "rb") as wf:
                  n_channels, sampwidth, framerate, n_frames = wf.getnchannels(), wf.getsampwidth(), wf.getframerate(), wf.getnframes()
                  raw = wf.readframes(n_frames)
              duration = max(1.5, n_frames / float(framerate))
              samples = np.frombuffer(raw, dtype=np.int16).astype(np.float32) / 32768.0 if sampwidth == 2 else np.zeros(int(duration * framerate), dtype=np.float32)
              if sampwidth == 2 and n_channels > 1:
                  samples = samples.reshape(-1, n_channels).mean(axis=1)
              total_frames = max(int(math.ceil(duration * fps)), 1)
              spc = max(1, len(samples) // total_frames)
              env = np.array([float(np.sqrt(np.mean(samples[i * spc : (i + 1) * spc] ** 2))) if len(samples[i * spc : (i + 1) * spc]) > 0 else 0.0 for i in range(total_frames)], dtype=np.float32)
              p95 = float(np.percentile(env, 95)) if len(env) > 0 else 0.1
              if p95 > 1e-4:
                  env = np.clip(env / p95, 0.0, 1.0)
              return np.convolve(env, np.array([0.25, 0.5, 0.25], dtype=np.float32), mode="same"), duration

          def synthesize_voiceover_segment(text: str, voice: str, out_mp3: Path, out_wav: Path) -> float:
              try:
                  subprocess.run([sys.executable, "-m", "edge_tts", "--voice", voice, "--rate=+8%", "--text", text, "--write-media", str(out_mp3)], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=35)
              except Exception:
                  from gtts import gTTS
                  gTTS(text=text, lang="ar" if voice.startswith("ar") else "en", slow=False).save(str(out_mp3))
              subprocess.run(["ffmpeg", "-y", "-i", str(out_mp3), "-ac", "1", "-ar", "24000", str(out_wav)], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              _, dur = compute_audio_envelope(out_wav)
              return dur

          def prepare_segment_broll_frames(seg: dict, seg_idx: int, lang: str, work_dir: Path, num_frames: int, target_w: int, target_h: int):
              broll_query = seg.get("broll_query", "Artificial intelligence technology")
              broll_prompt = seg.get("broll_prompt", broll_query)
              caption, badge = seg.get("caption", ""), seg.get("stat_badge", f"PART {seg_idx + 1}")
              vid_candidate = work_dir / f"broll_vid_{seg_idx}.webm"
              if fetch_wikimedia_visual(broll_query, vid_candidate, prefer_video=True) and vid_candidate.exists() and vid_candidate.stat().st_size > 20000:
                  raw_frames_dir = work_dir / f"broll_frames_{seg_idx}"
                  raw_frames_dir.mkdir(exist_ok=True)
                  try:
                      subprocess.run(["ffmpeg", "-y", "-i", str(vid_candidate), "-vf", f"scale={target_w}:{target_h}:force_original_aspect_ratio=increase,crop={target_w}:{target_h},fps=30", "-frames:v", str(num_frames), str(raw_frames_dir / "f_%04d.jpg")], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=25)
                      extracted = sorted(raw_frames_dir.glob("f_*.jpg"))
                      if len(extracted) >= 10:
                          frames = [np.array(Image.open(p).convert("RGB")) for p in extracted]
                          while len(frames) < num_frames:
                              frames.extend(frames[::-1])
                          return frames[:num_frames]
                  except Exception:
                      pass
              img_candidate = work_dir / f"broll_img_{seg_idx}.jpg"
              got_img = generate_flux_image_zerogpu(broll_prompt, img_candidate, width=768, height=768) or bool(fetch_wikimedia_visual(broll_query, img_candidate, prefer_video=False))
              if not (got_img and img_candidate.exists()):
                  build_procedural_infographic_card(img_candidate, caption, badge, lang, seg_idx)
              try:
                  base_im = Image.open(img_candidate).convert("RGB")
              except Exception:
                  build_procedural_infographic_card(img_candidate, caption, badge, lang, seg_idx)
                  base_im = Image.open(img_candidate).convert("RGB")
              overscale_w, overscale_h = int(target_w * 1.18), int(target_h * 1.18)
              base_arr = np.array(base_im.resize((overscale_w, overscale_h), Image.Resampling.LANCZOS))
              frames = []
              for f_idx in range(num_frames):
                  smooth_p = 0.5 - 0.5 * math.cos((f_idx / float(max(1, num_frames - 1))) * math.pi)
                  crop_w = int(target_w + (overscale_w - target_w) * (1.0 - 0.65 * smooth_p))
                  crop_h = int(target_h + (overscale_h - target_h) * (1.0 - 0.65 * smooth_p))
                  x0, y0 = int((overscale_w - crop_w) * (0.2 + 0.6 * smooth_p)), int((overscale_h - crop_h) * (0.2 + 0.6 * smooth_p))
                  frames.append(np.array(Image.fromarray(base_arr[y0 : y0 + crop_h, x0 : x0 + crop_w]).resize((target_w, target_h), Image.Resampling.BILINEAR)))
              return frames

          def build_caption_overlay_rgba(W: int, H: int, part_label: str, series_title: str, caption_text: str, stat_badge: str, lang: str, layout_mode: str):
              overlay = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              draw = ImageDraw.Draw(overlay, "RGBA")
              f_top, f_badge, f_cap = get_font(34), get_font(30), get_font(44)
              draw.rounded_rectangle([65, 58, W - 65, 138], radius=40, fill=(10, 14, 26, 215), outline=(0, 215, 255, 230), width=3)
              draw.text((W // 2, 98), shape_text(f"{part_label}  •  {series_title}", lang), font=f_top, fill=(255, 255, 255, 255), anchor="mm")
              if layout_mode == "split_screen":
                  draw.rectangle([0, 954, W, 966], fill=(0, 215, 255, 245))
                  draw.rounded_rectangle([W // 2 - 210, 932, W // 2 + 210, 988], radius=28, fill=(12, 18, 34, 245), outline=(255, 195, 45, 255), width=3)
                  draw.text((W // 2, 960), stat_badge, font=f_badge, fill=(255, 205, 55, 255), anchor="mm")
              cap_y0, cap_y1 = 1560, 1765
              draw.rounded_rectangle([55, cap_y0, W - 55, cap_y1], radius=30, fill=(8, 12, 24, 228), outline=(255, 195, 45, 235), width=4)
              words = caption_text.split()
              if len(words) > 5:
                  mid = len(words) // 2
                  draw.text((W // 2, cap_y0 + 68), shape_text(" ".join(words[:mid]), lang), font=f_cap, fill=(255, 255, 255, 255), anchor="mm")
                  draw.text((W // 2, cap_y0 + 135), shape_text(" ".join(words[mid:]), lang), font=f_cap, fill=(255, 215, 65, 255), anchor="mm")
              else:
                  draw.text((W // 2, (cap_y0 + cap_y1) // 2), shape_text(caption_text, lang), font=f_cap, fill=(255, 215, 65, 255), anchor="mm")
              rgba = np.array(overlay)
              return rgba[:, :, :3].astype(np.float32), (rgba[:, :, 3:4].astype(np.float32)) / 255.0

          def render_segment_video(seg: dict, seg_idx: int, total_segs: int, cfg: dict, part_label: str, series_title: str, portrait_path: Path, work_dir: Path) -> Path:
              W, H, FPS = 1080, 1920, 30
              lang, layout_mode = cfg["lang"], seg.get("layout", "split_screen")
              mp3_path, wav_path, out_mp4 = work_dir / f"seg_{seg_idx}.mp3", work_dir / f"seg_{seg_idx}.wav", work_dir / f"seg_{seg_idx}.mp4"
              synthesize_voiceover_segment(seg["narration"], cfg["voice"], mp3_path, wav_path)
              env, _ = compute_audio_envelope(wav_path, fps=FPS)
              num_frames = len(env)
              pres_im = Image.open(portrait_path).convert("RGB")
              pw, ph = pres_im.size
              target_aspect = 900.0 / 1100.0
              if pw / float(ph) > target_aspect:
                  new_w = int(ph * target_aspect)
                  pres_im = pres_im.crop(((pw - new_w) // 2, 0, (pw - new_w) // 2 + new_w, ph))
              else:
                  new_h = int(pw / target_aspect)
                  pres_im = pres_im.crop((0, max(0, (ph - new_h) // 4), pw, max(0, (ph - new_h) // 4) + new_h))
              pres_base = np.array(pres_im.resize((900, 1100), Image.Resampling.LANCZOS))
              mx, my, mouth_w, jaw_h = detect_face_and_mouth_anchor(pres_base)
              broll_frames = prepare_segment_broll_frames(seg, seg_idx, lang, work_dir, num_frames, W, 960 if layout_mode == "split_screen" else H)
              ov_rgb, ov_alpha = build_caption_overlay_rgba(W, H, part_label, series_title, seg.get("caption", ""), seg.get("stat_badge", part_label), lang, layout_mode)
              pip_size = 430
              py_grid, px_grid = np.mgrid[0:pip_size, 0:pip_size].astype(np.float32)
              pip_dist = np.sqrt((px_grid - pip_size * 0.5) ** 2 + (py_grid - pip_size * 0.5) ** 2)
              pip_circle_mask = np.clip((pip_size * 0.48 - pip_dist) / 4.0, 0.0, 1.0)[:, :, None]
              pip_ring_mask = ((pip_dist >= pip_size * 0.46) & (pip_dist <= pip_size * 0.49)).astype(np.float32)[:, :, None]
              proc = subprocess.Popen(["ffmpeg", "-y", "-f", "rawvideo", "-vcodec", "rawvideo", "-s", f"{W}x{H}", "-pix_fmt", "rgb24", "-r", str(FPS), "-i", "-", "-i", str(wav_path), "-c:v", "libx264", "-preset", "veryfast", "-crf", "21", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k", "-shortest", str(out_mp4)], stdin=subprocess.PIPE, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              for f_idx in range(num_frames):
                  t_sec, amp = f_idx / float(FPS), float(env[f_idx])
                  talking_pres = animate_human_presenter_frame(pres_base, mx, my, mouth_w, jaw_h, amp, t_sec)
                  sway_x, sway_y = int(14 * math.sin(t_sec * 1.7)), int(8 * math.cos(t_sec * 2.3))
                  crop_p = talking_pres[25 + sway_y : 1075 + sway_y, 25 + sway_x : 875 + sway_x]
                  canvas = np.zeros((H, W, 3), dtype=np.uint8)
                  if layout_mode == "presenter_full":
                      canvas[:, :, :] = np.array(Image.fromarray(crop_p).resize((W, H), Image.Resampling.BILINEAR))
                      inset_w, inset_h, ix0, iy0 = 390, 390, W - 445, 175
                      canvas[iy0 - 6 : iy0 + inset_h + 6, ix0 - 6 : ix0 + inset_w + 6] = (0, 215, 255)
                      canvas[iy0 : iy0 + inset_h, ix0 : ix0 + inset_w] = np.array(Image.fromarray(broll_frames[f_idx]).resize((inset_w, inset_h), Image.Resampling.BILINEAR))
                  elif layout_mode == "split_screen":
                      canvas[0:960, :, :] = broll_frames[f_idx]
                      canvas[960:1920, :, :] = np.array(Image.fromarray(crop_p[:780, :]).resize((W, 960), Image.Resampling.BILINEAR))
                  else:
                      canvas[:, :, :] = broll_frames[f_idx]
                      pip_pres = np.array(Image.fromarray(crop_p[:720, :]).resize((pip_size, pip_size), Image.Resampling.BILINEAR)).astype(np.float32)
                      px0, py0 = 65, 1060
                      bg_patch = canvas[py0 : py0 + pip_size, px0 : px0 + pip_size].astype(np.float32)
                      blended_pip = (bg_patch * (1.0 - pip_circle_mask) + pip_pres * pip_circle_mask) * (1.0 - pip_ring_mask) + np.array([255.0, 200.0, 45.0]) * pip_ring_mask
                      canvas[py0 : py0 + pip_size, px0 : px0 + pip_size] = blended_pip.astype(np.uint8)
                  active_w = int(120 + amp * 760)
                  bx0 = (W - active_w) // 2
                  canvas[1527:1537, bx0 : bx0 + active_w] = (0, 230, 255)
                  c_float = canvas.astype(np.float32) * (1.0 - ov_alpha) + ov_rgb * ov_alpha
                  proc.stdin.write(c_float.astype(np.uint8).tobytes())
              proc.stdin.close()
              proc.wait()
              return out_mp4

          def produce_channel_episode(channel_key: str, cfg: dict, output_root: Path):
              work_dir = output_root / f"work_{channel_key}"
              if work_dir.exists():
                  shutil.rmtree(work_dir)
              work_dir.mkdir(parents=True, exist_ok=True)
              script_data = generate_dynamic_script(channel_key, cfg)
              part_label, series_title = script_data.get("part", "Part 1"), script_data.get("series_title", cfg["name"])
              portrait_path = work_dir / "presenter_portrait.jpg"
              build_realistic_studio_presenter_portrait(portrait_path, cfg, work_dir)
              seg_files = [render_segment_video(seg, idx, len(script_data["segments"]), cfg, part_label, series_title, portrait_path, work_dir) for idx, seg in enumerate(script_data["segments"])]
              concat_list = work_dir / "concat.txt"
              concat_list.write_text("\n".join([f"file '{p.resolve()}'" for p in seg_files]), encoding="utf-8")
              final_mp4 = output_root / f"{channel_key}_latest.mp4"
              subprocess.run(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(concat_list), "-c", "copy", str(final_mp4)], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              return final_mp4, script_data

          def upload_to_youtube(video_path: Path, script_data: dict, cfg: dict):
              token_raw = os.environ.get(cfg["secret_env"], "").strip()
              if not token_raw:
                  return None
              try:
                  from google.oauth2.credentials import Credentials
                  from google.auth.transport.requests import Request
                  from googleapiclient.discovery import build
                  from googleapiclient.http import MediaFileUpload
                  creds = Credentials.from_authorized_user_info(json.loads(token_raw))
                  if creds.expired and creds.refresh_token:
                      creds.refresh(Request())
                  youtube = build("youtube", "v3", credentials=creds)
                  title = script_data.get("title", f"{cfg['name']} #Shorts")[:98]
                  desc = f"{title}\n\n" + "\n\n".join([s.get("narration", "") for s in script_data.get("segments", [])]) + "\n\n#Shorts #AI #Wealth"
                  body = {"snippet": {"title": title, "description": desc, "tags": ["Shorts", "AI", "Wealth"], "categoryId": "28" if cfg["lang"] == "ar" else "27"}, "status": {"privacyStatus": "public", "selfDeclaredMadeForKids": False}}
                  media = MediaFileUpload(str(video_path), chunksize=-1, resumable=True, mimetype="video/mp4")
                  resp = youtube.videos().insert(part="snippet,status", body=body, media_body=media).execute()
                  print(f"Uploaded YouTube Video ID: {resp.get('id')}")
                  return resp.get("id")
              except Exception as e:
                  print(f"YouTube upload error: {e}")
                  return None

          def main():
              output_root = Path("output_videos")
              output_root.mkdir(parents=True, exist_ok=True)
              target_filter = os.environ.get("TARGET_CHANNEL", "all").strip().lower()
              for ch_key, cfg in CHANNELS.items():
                  if target_filter not in ("all", "", ch_key.lower()):
                      continue
                  video_path, script_data = produce_channel_episode(ch_key, cfg, output_root)
                  if os.environ.get("DRY_RUN", "0") != "1":
                      upload_to_youtube(video_path, script_data, cfg)

          if __name__ == "__main__":
              main()
          EOF_PIPELINE_SCRIPT

      - name: Run AI Video Pipeline & Publish to YouTube
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_CHANNEL: ${{ github.event.inputs.target_channel || 'all' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_TOKEN_CH02_AR: ${{ secrets.YT_TOKEN_CH02_AR }}
          YT_TOKEN_CH03_EN: ${{ secrets.YT_TOKEN_CH03_EN }}
        run: |
          python3 auto_video_pipeline.py

      - name: Upload Generated Videos as downloadable Workflow Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empire-published-shorts-${{ github.run_number }}
          path: output_videos/*.mp4
          retention-days: 7
