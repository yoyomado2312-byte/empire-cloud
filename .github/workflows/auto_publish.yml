name: Empire Auto Video Publisher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel (all, ch02_ar_ai_tech, ch03_en_wealth_business)'
        required: false
        default: 'all'
      dry_run:
        description: 'Run in Dry Run mode (1 = test only without YouTube upload, 0 = publish)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  publish_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Arabic Fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-kacst fonts-dejavu-core libgl1

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install numpy scipy pillow onnxruntime edge-tts gTTS arabic-reshaper python-bidi gradio_client google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 requests

      - name: Run AI Video Pipeline & Publish to YouTube
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_CHANNEL: ${{ github.event.inputs.target_channel || 'all' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_TOKEN_CH02_AR: ${{ secrets.YT_TOKEN_CH02_AR }}
          YT_TOKEN_CH03_EN: ${{ secrets.YT_TOKEN_CH03_EN }}
        run: |
          python3 -m py_compile auto_video_pipeline.py
          python3 auto_video_pipeline.py

      - name: Upload Generated Videos as Workflow Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empire-published-shorts-${{ github.run_number }}
          path: output_videos/*.mp4
          retention-days: 7
