name: Empire Auto Video Publisher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel (all, ch02_ar_ai_tech, ch03_en_wealth_business)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  publish_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg & Arabic Fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-dejavu-core libgl1

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install numpy pillow edge-tts gTTS arabic-reshaper python-bidi gradio_client google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 requests

